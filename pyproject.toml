[tool.esbonio.sphinx]
pythonCommand = ["hatch", "-e", "blog", "run", "python"]

[tool.hatch.envs.blog]
installer = "uv"
python = '3.13'
skip-install = true
dependencies = [
  "sphinx",
  "myst-parser",
  "awdur @ git+https://github.com/swyddfa/awdur@develop#subdirectory=lib/awdur"
]

[tool.hatch.envs.blog.scripts]
build = "sphinx-build -M dirhtml . ./_build"
