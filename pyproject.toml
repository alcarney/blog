[tool.hatch.envs.blog]
installer = "uv"
python = '3.10'
skip-install = true
dependencies = [
  "ablog",
  "sphinx",
  "sphinx-design",
  "awdur @ git+https://github.com/swyddfa/awdur@develop#subdirectory=lib/awdur"
]

[tool.hatch.envs.blog.scripts]
build = "ablog build -w _build/html -d _build/doctrees"
