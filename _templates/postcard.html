{%- if record %}
<section class="post-metadata">
    <h5 style="grid-column: span 2">Metadata</h5>
    {%- include "icon_calendar.html" %}
    <time style="align-self: center; text-align: right;" datetime="{{ record.timestamp }}">{{ record.timestamp.strftime('%b %d, %Y') }}</time>

    {%- include "icon_tag.html" %}
    <ul class="taglist">
        {%- for tag in record.tags %}
        <li>
            <a class="tag" href="{{ pathto('tag/' + tag) }}">
                #{{ tag }}
            </a>
        </li>
        {%- endfor %}
    </ul>
</section>
{%- endif %}
