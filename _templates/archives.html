<ul class="flex flex-col p-4 space-y-2 border-t border-gray-600 text-center">
  {% for year, posts in denote.posts.by_year().items()  %}
  <li class="text-md">
    <a href="{{ pathto('blog/{}'.format(year)) }}">
        <span class="text-green-600">{{ year }}</span>
        <span class="text-white">({{ posts|length }})</span>
    </a>
  </li>
  {% endfor %}
</ul>
