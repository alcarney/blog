<section id="blog-archive">
  <h5>Archive</h5>
  <ul>
  {% for year, posts in denote.posts.by_year()|dictsort(reverse=True)  %}
  <li>
    <a href="{{ pathto('blog/{}'.format(year)) }}">
        <span>{{ year }}</span>
        <span class="count">({{ posts|length }})</span>
    </a>
  </li>
  {% endfor %}
</ul>
</section>
