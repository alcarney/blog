{%- extends "layout.html" %}
{%- block body %}

<h1>{{ title }}</h1>

{%- for post in collection %}
  <article class="summary">
    <header>
      <a href="{{ pathto(post.docname) }}">
        <h2 style="max-width: 33ch" class="mb-4 text-2xl text-green-600">{{ post.title }}</h2>
      </a>
    </header>
    <aside>
      {%- with record=post %}
        {% include "postcard.html" %}
      {%- endwith %}
    </aside>

    <div style="min-width: 0">
      {{ render_summary(post, relative_to=pagename) }}
    </div>

    <footer>
      <p>
        <a href="{{ pathto(post.docname) }}">Read More...</a>
      </p>
    </footer>
  </article>
{%- endfor %}
{% endblock %}
